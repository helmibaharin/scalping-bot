name: Verify source and offline rules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-rules:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Standalone project checks
        run: ./tests/verify_project.ps1
      - name: Production rule adaptations
        run: ./tests/test_rules.ps1
      - name: Production risk and execution adaptations
        run: ./tests/test_risk_execution.ps1
  offline-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python report tests
        run: python -m unittest discover -s tests -p 'test_*.py'
